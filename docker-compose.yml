# Run the Gloamy daemon from Docker.
#
#   cp .env.example .env          # set at least one provider API key
#   docker compose up -d --build
#   docker compose logs -f gloamy # first run prints the one-time pairing code
#
# Requires Docker Compose v2.24+ (for the optional `env_file` form below).
# For the sandboxed development stack, see dev/docker-compose.yml.
name: gloamy

services:
  gloamy:
    build:
      context: .
      target: release
      args:
        VERSION: ${GLOAMY_VERSION:-dev}
    image: gloamy:local
    container_name: gloamy
    restart: unless-stopped
    command: ["gateway"]
    environment:
      # Docker port forwarding requires the process to listen on the container
      # interface. Host exposure remains restricted to loopback below.
      GLOAMY_GATEWAY_HOST: 0.0.0.0
      GLOAMY_GATEWAY_PORT: "42617"
      GLOAMY_ALLOW_PUBLIC_BIND: "true"
      GLOAMY_WORKSPACE: /gloamy-data/workspace
    env_file:
      - path: .env
        required: false
    volumes:
      - gloamy-data:/gloamy-data
    ports:
      - "127.0.0.1:42617:42617"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:42617/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  gloamy-data:
